<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>الصفحة غير موجودة | Prompt better</title>
    <meta name="robots" content="noindex" />
    <meta name="description" content="الصفحة غير موجودة. عد إلى الصفحة الرئيسية لتجربة البروميتات وأفكار الفيديوهات AI." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      :root {
        --bg: #f6f1ff;
        --ink: #170f2c;
        --ink-soft: #514d72;
        --card: #ffffff;
        --line: #ddd1f8;
        --accent: #e8336a;
        --accent-3: #3a66ff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(180deg, var(--bg) 0%, #faf7ff 100%);
        color: var(--ink);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .card {
        width: min(560px, calc(100% - 32px));
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 28px;
        box-shadow: 0 18px 42px rgba(22,15,45,0.08);
        padding: 28px 22px;
        text-align: center;
      }
      .badge {
        display: inline-block;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(58,102,255,0.08);
        color: var(--ink-soft);
        font-size: 0.8rem;
        margin-bottom: 12px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 6vw, 3rem);
        line-height: 1.2;
      }
      p {
        margin: 0 0 18px;
        color: var(--ink-soft);
        line-height: 1.8;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        padding: 14px 22px;
        background: linear-gradient(135deg, var(--accent), #ff4b87);
        color: #fff;
        border-radius: 999px;
        font-weight: 700;
      }
      a:focus-visible { outline: 3px solid var(--accent-3); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">Prompt better</div>
      <h1>الصفحة غير موجودة</h1>
      <p>قد تكون هذه الصفحة تم نقلها أو حذفها. عد إلى الصفحة الرئيسية لاكتشاف البروميتات وأفكار video AI.</p>
      <a href="/higgsfield-bio/" aria-label="العودة إلى الصفحة الرئيسية">العودة إلى الصفحة الرئيسية</a>
    </main>
  </body>
</html>
